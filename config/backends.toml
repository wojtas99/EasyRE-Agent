default = "claude-opus"

# Optional per profile: price_in / price_out = USD per 1M input / output tokens.
# `easyre stats` uses them to show costs for API models.
# Example:  price_in = 0.27   price_out = 1.10
#
# Claude models use full IDs, so every job runs on a known version. Update them
# when a new model comes out. The aliases opus / sonnet / haiku also work and
# always pick the newest model of that family.

[profiles.claude-opus]
backend = "claude"
model = "claude-opus-5-5"

[profiles.claude-sonnet]
backend = "claude"
model = "claude-sonnet-5-5"

[profiles.claude-haiku]
backend = "claude"
model = "claude-haiku-5-5"

[profiles.openai-api]
backend = "openai"
base_url = "https://api.openai.com/v1"
model = "gpt-4.1"
api_key_env = "OPENAI_API_KEY"

[profiles.codex]
backend = "codex"

[profiles.ollama-qwen]
backend = "openai"
base_url = "http://host.docker.internal:11434/v1"
model = "qwen3-coder"
api_key = "ollama"

[profiles.lmstudio]
backend = "openai"
base_url = "http://host.docker.internal:1234/v1"
model = "local-model"
api_key = "lm-studio"

[profiles.openrouter]
backend = "openai"
base_url = "https://openrouter.ai/api/v1"
model = "deepseek/deepseek-chat"
api_key_env = "OPENROUTER_API_KEY"

[profiles.gemini]
backend = "openai"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-2.5-pro"
api_key_env = "GEMINI_API_KEY"
